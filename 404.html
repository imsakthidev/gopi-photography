<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moment Got Away | GOPI PHOTOGRAPHY</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background-color: var(--bg);
    }
    .not-found-monogram {
      width: 60px;
      height: 60px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-heading);
      font-size: 30px;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .not-found-wrap h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      color: var(--primary);
      margin-bottom: 12px;
    }
    .not-found-wrap p {
      font-size: 1.1rem;
      color: var(--secondary);
      max-width: 460px;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-monogram">G</div>
    <span class="section-kicker">404 — PAGE NOT FOUND</span>
    <h1>Looks like this moment got away.</h1>
    <p>The frame you are looking for may have been moved, archived, or retitled.</p>
    <a href="/#stories" class="btn-primary">
      Back to Stories →
    </a>
  </div>
</body>
</html>
